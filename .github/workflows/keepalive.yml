name: Mantener Supabase despierto

# Los proyectos gratuitos de Supabase se pausan tras 7 días sin actividad y el ranking
# dejaría de funcionar. Una consulta cada 3 días lo mantiene activo.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.VITE_SUPABASE_URL != '' }}
    steps:
      - name: Consultar el ranking
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/leaderboard" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"p_mode":"mezcla","p_limit":1}' > /dev/null
          echo "Supabase responde"
